name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  browsers:
    name: Chromium y WebKit
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm --filter @rutasegura/app exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/rutasegura/playwright-report
          retention-days: 7

  # Entorno Docker completo (app, PostgreSQL, Redis y MinIO con bucket privado)
  # con la imagen de producción: smoke de API e integración, expiración real de
  # la URL firmada y flujos de UI con la CSP estricta.
  smoke:
    name: Smoke y flujos de UI en Docker (imagen runner)
    runs-on: ubuntu-latest
    needs: quality
    env:
      APP_BUILD_TARGET: runner
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm test:smoke
      - run: ./scripts/evidence-signed-urls.sh
      - run: pnpm --filter @rutasegura/app exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e:flows
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-flows
          path: apps/rutasegura/test-results
          retention-days: 7
      - if: failure()
        run: docker compose logs --no-color --tail 200
      - if: always()
        run: docker compose down --volumes
